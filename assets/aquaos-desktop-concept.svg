    <linearGradient id="wave" x2="1" y2=".2"><stop stop-color="#087c91"/><stop offset=".48" stop-color="#12d8d2"/><stop offset="1" stop-color="#0e526a"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#182d37" stop-opacity=".94"/><stop offset="1" stop-color="#09151d" stop-opacity=".97"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
