insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

set default=0
set timeout=5

menuentry "AquaOS 26 H2 live (%ARCH%, UEFI)" {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "System shutdown" {
    halt
}

menuentry "System restart" {
    reboot
}
