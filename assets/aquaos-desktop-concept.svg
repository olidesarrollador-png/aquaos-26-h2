<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AquaOS 26 H2 desktop concept</title><desc id="desc">A conceptual KDE-style desktop with a black and aqua wave wallpaper, top panel, dock, terminal and application overview.</desc>
  <defs>
